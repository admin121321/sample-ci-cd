<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CI/CD Gituhub Action</title>
	<style>
		:root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#94a3b8}
		html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
		body{background:linear-gradient(180deg,#071226 0%,#081428 60%);display:flex;align-items:center;justify-content:center;color:#e6eef6}
		.card{background:linear-gradient(135deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.04);backdrop-filter:blur(6px);padding:36px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6);width:420px;max-width:90%;text-align:center}
		.logo{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);box-shadow:0 6px 22px rgba(8,145,178,0.18);font-weight:700;color:#021025}
		h1{margin:8px 0 6px;font-size:20px;letter-spacing:0.2px}
		p.desc{margin:0 0 18px;color:var(--muted);font-size:14px}
		.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(6,182,212,0.12);color:var(--accent);font-weight:600;border:1px solid rgba(6,182,212,0.12);font-size:13px}
		.steps{margin-top:18px;text-align:left}
		.step{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:8px}
		.step .num{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.03);display:grid;place-items:center;color:var(--muted);font-weight:700}
		.step .txt{color:#dbeafe}
		.actions{margin-top:18px;display:flex;gap:10px;justify-content:center}
		.btn{padding:10px 14px;border-radius:8px;border:0;background:#071827;color:#cdeef6;cursor:pointer;font-weight:600}
		.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
		footer{margin-top:16px;font-size:12px;color:var(--muted)}
	</style>
</head>
<body>
	<main class="card">
		<div class="logo">CI</div>
		<h1>CI/CD Gituhub Action</h1>
		<p class="desc">Contoh sederhana halaman yang menampilkan status dan langkah CI/CD menggunakan GitHub Actions.</p>
		<div style="display:flex;gap:10px;justify-content:center;margin-bottom:8px">
			<span class="badge" id="status">Idle</span>
		</div>

		<div class="steps">
			<div class="step"><div class="num">1</div><div class="txt">Mau Tau Aja</div></div>
			<div class="step"><div class="num">2</div><div class="txt">Masa Sih</div></div>
			<div class="step"><div class="num">3</div><div class="txt">GCR Image:Latest</div></div>
			<div class="step"><div class="num">4</div><div class="txt">Deploy to environment</div></div>
		</div>

		<div class="actions">
			<button class="btn" id="run">Simulate Run</button>
			<button class="btn ghost" id="reset">Reset</button>
		</div>
		<footer>Last updated: <span id="time">-</span></footer>
	</main>

	<script>
		const statusEl = document.getElementById('status');
		const timeEl = document.getElementById('time');
		const runBtn = document.getElementById('run');
		const resetBtn = document.getElementById('reset');
		function setStatus(s){statusEl.textContent = s}
		function ts(){return new Date().toLocaleString()}
		runBtn.addEventListener('click', async ()=>{
			setStatus('Running'); timeEl.textContent = ts();
			// simulate steps
			const steps = ['Checkout','Install','Test','Build','Deploy'];
			for(let i=0;i<steps.length;i++){
				setStatus(steps[i]+ '...');
				await new Promise(r=>setTimeout(r,800));
			}
			setStatus('Success'); timeEl.textContent = ts();
		});
		resetBtn.addEventListener('click', ()=>{setStatus('Idle'); timeEl.textContent = '-'});
		// initialize
		timeEl.textContent = '-';
	</script>
</body>
</html>
