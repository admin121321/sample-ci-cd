<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Sample Deploy Kube - Demo</title>
	<style>
		:root{--bg:#0f1724;--card:#111827;--accent:#3b82f6;--muted:#94a3b8;--glass:rgba(255,255,255,0.04)}
		*{box-sizing:border-box}
		body{margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#071025);color:#e6eef8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
		.container{width:100%;max-width:900px}
		.card{background:linear-gradient(180deg,var(--card),#0b1220);border-radius:12px;padding:28px;box-shadow:0 6px 30px rgba(2,6,23,0.6);backdrop-filter:blur(6px)}
		header{display:flex;align-items:center;justify-content:space-between;gap:16px}
		.brand{display:flex;align-items:center;gap:12px}
		.logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#06b6d4);display:flex;align-items:center;justify-content:center;font-weight:700;color:#04263b}
		h1{font-size:20px;margin:0}
		p.lead{color:var(--muted);margin:6px 0 0;font-size:14px}
		.controls{display:flex;gap:8px;align-items:center}
		button{background:var(--glass);border:1px solid rgba(255,255,255,0.06);color:inherit;padding:10px 14px;border-radius:8px;cursor:pointer}
		button.primary{background:linear-gradient(90deg,var(--accent),#06b6d4);color:#032235;border:none}
		main{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:20px}
		.panel{background:rgba(255,255,255,0.02);padding:16px;border-radius:10px}
		.list{display:flex;flex-direction:column;gap:10px}
		.item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent)}
		.badge{background:rgba(255,255,255,0.03);padding:6px 10px;border-radius:999px;font-size:13px}
		.status{width:10px;height:10px;border-radius:50%}
		.status.up{background:#34d399}
		.status.down{background:#f97316}
		footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:right}
		@media(max-width:880px){main{grid-template-columns:1fr;}
			.controls{flex-wrap:wrap}}
	</style>
</head>
<body>
	<div class="container">
		<div class="card">
			<header>
				<div class="brand">
					<div class="logo">KD</div>
					<div>
						<h1>Sample Deploy Kube</h1>
						<p class="lead">Demo dashboard sederhana dengan HTML, CSS, dan JavaScript</p>
					</div>
				</div>
				<div class="controls">
					<button id="refresh">Refresh</button>
					<button class="primary" id="add">Tambah Service</button>
				</div>
			</header>

			<main>
				<section class="panel">
					<h2 style="margin:0 0 12px">Services</h2>
					<div class="list" id="serviceList">
						<!-- items injected by JS -->
					</div>
				</section>

				<aside class="panel">
					<h3 style="margin-top:0">Kontrol</h3>
					<div style="margin-top:12px">
						<label style="display:block;margin-bottom:8px">Filter status</label>
						<select id="filter" style="width:100%;padding:8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:inherit">
							<option value="all">Semua</option>
							<option value="up">Aktif</option>
							<option value="down">Down</option>
						</select>
					</div>
					<footer>v1.0 • demo</footer>
				</aside>
			</main>
		</div>
	</div>

	<script>
		const services = [
			{id:1,name:'auth-service',status:'up'},
			{id:2,name:'api-gateway',status:'up'},
			{id:3,name:'worker',status:'down'}
		];

		const serviceList = document.getElementById('serviceList');
		const filter = document.getElementById('filter');

		function render(list){
			serviceList.innerHTML = '';
			list.forEach(s=>{
				const el = document.createElement('div'); el.className='item';
				el.innerHTML = `<div><strong>${s.name}</strong><div style="color:var(--muted);font-size:12px">ID: ${s.id}</div></div><div style="display:flex;align-items:center;gap:10px"><span class="badge">${s.status}</span><span class="status ${s.status}"></span></div>`;
				serviceList.appendChild(el);
			})
		}

		function applyFilter(){
			const v = filter.value;
			if(v==='all') render(services);
			else render(services.filter(s=>s.status===v));
		}

		document.getElementById('refresh').addEventListener('click',()=>{
			// simulate status change
			services.forEach(s=>{ if(Math.random()>0.7) s.status = s.status==='up'?'down':'up' });
			applyFilter();
		});

		document.getElementById('add').addEventListener('click',()=>{
			const id = services.length?services[services.length-1].id+1:1;
			services.push({id,name:`service-${id}`,status:Math.random()>0.5?'up':'down'});
			applyFilter();
		});

		filter.addEventListener('change',applyFilter);

		// initial render
		render(services);
	</script>
</body>
</html>
